    <div id="mbody"></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
/* ================================================================
   1 · CONFIG & DATA
================================================================ */
const CITIES = {
  BKK:{city:'Bangkok',cc:'TH',lat:13.69,lon:100.75,grid:0.499,idx:0.90,districts:['Sukhumvit','Riverside','Old Town','Thonglor']},
  NRT:{city:'Tokyo',cc:'JP',lat:35.77,lon:140.39,grid:0.470,idx:1.15,districts:['Shinjuku','Shibuya','Ginza']},
  SIN:{city:'Singapore',cc:'SG',lat:1.36,lon:103.99,grid:0.417,idx:1.10,districts:['Chinatown','Tiong Bahru','Marina East']},
  HKG:{city:'Hong Kong',cc:'HK',lat:22.31,lon:113.91,grid:0.570,idx:1.20,districts:['TST','Sheung Wan','Mong Kok']},
  DPS:{city:'Bali',cc:'ID',lat:-8.75,lon:115.17,grid:0.660,idx:0.80,districts:['Ubud','Seminyak','Canggu']},
  CDG:{city:'Paris',cc:'FR',lat:49.01,lon:2.55,grid:0.058,idx:1.10,districts:['Le Marais','Saint-Germain','Batignolles']},
  LHR:{city:'London',cc:'UK',lat:51.47,lon:-0.45,grid:0.212,idx:1.25,districts:['Mayfair','South Bank','Shoreditch']},
  BCN:{city:'Barcelona',cc:'ES',lat:41.30,lon:2.08,grid:0.162,idx:0.86,districts:['Eixample','Gothic Quarter','Gràcia']},
  FCO:{city:'Rome',cc:'IT',lat:41.80,lon:12.25,grid:0.326,idx:0.96,districts:['Monti','Trastevere','Prati']},
  CPH:{city:'Copenhagen',cc:'DK',lat:55.62,lon:12.65,grid:0.117,idx:1.22,districts:['Nørrebro','Indre By','Refshaleøen']},
  JFK:{city:'New York',cc:'US',lat:40.64,lon:-73.78,grid:0.386,idx:1.38,districts:['SoHo','Williamsburg','Midtown East']},
  SFO:{city:'San Francisco',cc:'US',lat:37.62,lon:-122.38,grid:0.386,idx:1.42,districts:['Mission','Nob Hill','Dogpatch']}
};
const AIRLINES = [
  {code:'NB',name:'Nimbus Air',fare:1.00},
  {code:'TA',name:'TransAtlas',fare:1.06},
  {code:'CL',name:'Caelia',fare:0.84},
  {code:'AV',name:'AirVolt',fare:0.79},
  {code:'SK',name:'Skýlink',fare:1.03},
  {code:'OM',name:'Orient Meridian',fare:0.96},
  {code:'BP',name:'BluePacifica',fare:1.01}
];
const AIRCRAFT = {'A320neo':0.86,'B737-8':0.88,'A321neo':0.87,'A330-300':1.06,'B787-9':0.88,'A350-900':0.85,'B777-300ER':1.09,'A380-800':1.00};
const CABINS = {
  economy:{name:'Economy',fare:1.00,mult:1.00},
  premium:{name:'Premium',fare:1.55,mult:1.60},
  business:{name:'Business',fare:3.40,mult:2.92},
  first:{name:'First',fare:5.20,mult:4.02}
};
const HOTEL_NAMES = ['Casa Lumen','The Verdia','Miremar Grand','Hotel Norly','Onze & Co.','Aurelia House','The Ironwood','Belvédère 9','Hotel Cardamom','Riverrun House','Maison Ondine','The Cartographer','Solaris Yard','Hotel Terra Viva'];
const CERTS = ['Green Key','LEED Gold','BREEAM Excellent','EarthCheck','GSTC Verified'];
const FACTORS = {gas:0.183, heat:0.150, gwp:2088, laundry:2.7};
const RF = 1.9;
const ROUTES = [['BKK','NRT'],['BKK','SIN'],['BKK','DPS'],['BKK','HKG'],['BKK','CDG']];

const iso = d => d.toISOString().slice(0,10);
const state = {
  view:'home', tab:'flights',
  origin:'BKK', dest:'NRT',
  depart:iso(new Date(Date.now()+14*864e5)), ret:iso(new Date(Date.now()+18*864e5)),
  pax:2, cabin:'economy', gc:0, rf:false,
  wF:{price:40,time:20,carbon:40}, wH:{price:45,carbon:55}, minStars:0,
  flights:[], hotels:[], hVis:[], fSearch:false, hSearch:false,
  selF:null, selH:null, openF:null, openH:null
};

/* ================================================================
   2 · UTILITIES
================================================================ */
const $ = s => document.querySelector(s);
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pickR=(rng,arr)=>arr[Math.floor(rng()*arr.length)];
function shuffle(a,rng){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function haversine(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r;
  const s=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
const fmtE = n => '€'+Math.round(n).toLocaleString('en-GB');
const fmtE2= n => '€'+n.toFixed(2);
const fmtI = n => Math.round(n).toLocaleString('en-GB');
const kg   = n => n>=1000 ? (n/1000).toFixed(2)+' tCO₂e' : Math.round(n)+' kgCO₂e';
const kgS  = n => n>=1000 ? (n/1000).toFixed(1)+' t' : Math.round(n)+' kg';
const hhmm = m => {m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dur  = m => Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
const median = a => {const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const nights = () => Math.max(0, Math.round((new Date(state.ret)-new Date(state.depart))/864e5));
const roomsN = () => Math.ceil(state.pax/2);
const co2Disp = f => f.co2*(state.rf?RF:1);
const datefmt = s => new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const airlineName = f => f.stops ? f.legs[0].al.name+' + '+f.legs[1].al.name : f.legs[0].al.name;
function legLabel(f,i){
  if(!f.stops) return CITIES[state.origin].city+' → '+CITIES[state.dest].city;
  return i===0 ? CITIES[state.origin].city+' → '+CITIES[f.via].city : CITIES[f.via].city+' → '+CITIES[state.dest].city;
}
function ticks(min,max,n){const span=max-min||max||1,s0=span/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),nm=s0/mag;
  const st=(nm<1.5?1:nm<3?2:nm<7?5:10)*mag,out=[];for(let v=Math.ceil(min/st)*st;v<=max+1e-9;v+=st)out.push(v);return out}
function countUp(el,to,fmt,d=800){
  if(!el)return;const t0=performance.now(),from=parseFloat(el.dataset.v)||0;el.dataset.v=to;
  (function fr(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(fr)})(t0);
}
function toast(msg,ic='check'){
  const w=$('#toasts'),d=document.createElement('div');d.className='toast';
  d.innerHTML=`<i data-lucide="${ic}"></i><span>${msg}</span>`;w.appendChild(d);
  window.lucide&&lucide.createIcons();
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),320)},3600);
}
function flipUpdate(cont,html,key='data-fk'){
  const old=[...cont.querySelectorAll('['+key+']')].map(el=>({k:el.getAttribute(key),r:el.getBoundingClientRect().top}));
  cont.innerHTML=html;
  [...cont.querySelectorAll('['+key+']')].forEach(el=>{
    const o=old.find(a=>a.k===el.getAttribute(key));if(!o)return;
    const dy=o.r-el.getBoundingClientRect().top;
    if(Math.abs(dy)>2){el.style.transition='none';el.style.transform=`translateY(${dy}px)`;
      requestAnimationFrame(()=>{el.style.transition='transform .45s cubic-bezier(.22,.9,.3,1)';el.style.transform=''});
      setTimeout(()=>{el.style.transition='';el.style.transform=''},480);}
  });
}
const icons = ()=>window.lucide&&lucide.createIcons();
const CSSV = getComputedStyle(document.documentElement);
const C_T2=CSSV.getPropertyValue('--text-2').trim(), C_ACC=CSSV.getPropertyValue('--acc').trim(),
      C_PANEL=CSSV.getPropertyValue('--panel').trim();

/* ================================================================
   3 · MODELS
================================================================ */
const efBand = d => d<1500?0.158 : d<4000?0.120 : 0.115;
const fareKm = d => d<1500?0.115 : d<4000?0.072 : 0.052;
const legCO2 = (d,ac,mult) => d*efBand(d)*mult*AIRCRAFT[ac];
function pickAircraft(d,rng){
  if(d<1900) return pickR(rng,['A320neo','B737-8','A321neo']);
  if(d<4200) return pickR(rng,['A321neo','A330-300','B787-9']);
  return pickR(rng,['B787-9','A350-900','B777-300ER','A380-800']);
}
function genFlights(){
  const GC=state.gc, rng=mulberry32(hash(state.origin+state.dest+state.depart+state.cabin+'v5'));
  const cab=CABINS[state.cabin], long=GC>3500;
  const pool=AIRLINES.filter(a=>!long||a.code!=='AV');
  const L=[]; let n=0;
  for(let i=0;i<5;i++){
    const al=pool[Math.floor(rng()*pool.length)], ac=pickAircraft(GC,rng);
    const dist=Math.round(GC+95);
    const t=Math.round(40+dist/830*60*(0.96+rng()*0.08));
    const price=Math.round((38+dist*fareKm(dist))*al.fare*(0.9+rng()*0.22)*cab.fare);
    const co2=Math.round(legCO2(dist,ac,cab.mult));
    const dep=Math.round((6+rng()*13)*12)*5;
    L.push({id:'F'+(++n),no:al.code+' '+(104+Math.floor(rng()*880)),stops:0,via:null,lay:0,
      legs:[{al,ac,dist}],price,dur:t,co2,dep,arr:dep+t});
  }
  const hubs=Object.keys(CITIES).filter(k=>k!==state.origin&&k!==state.dest)
    .map(k=>({k,r:(haversine(CITIES[state.origin],CITIES[k])+haversine(CITIES[k],CITIES[state.dest]))/Math.max(1,GC)}))
    .filter(h=>h.r<1.9).sort((a,b)=>a.r-b.r).slice(0,4);
  hubs.forEach(h=>{
    const cnt=1+(rng()<0.55?1:0);
    for(let c=0;c<cnt;c++){
      const a1=pool[Math.floor(rng()*pool.length)], a2=pool[Math.floor(rng()*pool.length)];
      const d1=Math.round(haversine(CITIES[state.origin],CITIES[h.k])+95);
      const d2=Math.round(haversine(CITIES[h.k],CITIES[state.dest])+95);
      const ac1=pickAircraft(d1,rng), ac2=pickAircraft(d2,rng);
      const lay=Math.round(75+rng()*135);
      const t=Math.round(40+d1/830*60+40+d2/830*60+lay);
      const price=Math.round(((38+d1*fareKm(d1))*a1.fare+(38+d2*fareKm(d2))*a2.fare)*0.86*(0.92+rng()*0.14)*cab.fare);
      const co2=Math.round(legCO2(d1,ac1,cab.mult)+legCO2(d2,ac2,cab.mult));
      const dep=Math.round((6+rng()*12)*12)*5;
      L.push({id:'F'+(++n),no:a1.code+' '+(104+Math.floor(rng()*880)),stops:1,via:h.k,lay,
        legs:[{al:a1,ac:ac1,dist:d1},{al:a2,ac:ac2,dist:d2}],price,dur:t,co2,dep,arr:dep+t});
    }
  });
  return L;
}
function normW(w){const s=w.price+w.time+w.carbon;return{price:w.price/s,time:w.time/s,carbon:w.carbon/s}}
function rankFlights(){
  const L=state.flights, w=normW(state.wF);
  const p=[Math.min(...L.map(f=>f.price)),Math.max(...L.map(f=>f.price))];
  const t=[Math.min(...L.map(f=>f.dur)),Math.max(...L.map(f=>f.dur))];
  const c=[Math.min(...L.map(f=>f.co2)),Math.max(...L.map(f=>f.co2))];
  L.forEach(f=>f.score = w.price*(f.price-p[0])/(p[1]-p[0]||1) + w.time*(f.dur-t[0])/(t[1]-t[0]||1) + w.carbon*(f.co2-c[0])/(c[1]-c[0]||1));
  L.sort((a,b)=>a.score-b.score);
  L.forEach((f,i)=>f.rank=i+1);
}
function computeDerivedFlights(){
  const L=state.flights;
  L.forEach(f=>f.par=!L.some(g=>g!==f&&g.price<=f.price&&g.dur<=f.dur&&g.co2<=f.co2&&(g.price<f.price||g.dur<f.dur||g.co2<f.co2)));
  const co2s=L.map(f=>f.co2).sort((a,b)=>a-b);
  state.fMed={price:median(L.map(f=>f.price)),co2:median(co2s),dur:median(L.map(f=>f.dur))};
  state.fMax={co2:co2s[co2s.length-1]};
  state.fQ=[co2s[Math.floor(co2s.length*0.25)],co2s[Math.floor(co2s.length*0.75)]];
  rankFlights();
}
const co2Band = f => f.co2<=state.fQ[0]?'low':f.co2>=state.fQ[1]?'high':'mid';

function hcmi(h,grid){
  const s2e=h.elec*grid, s1g=h.gas*FACTORS.gas, s1h=h.heat*FACTORS.heat, s1r=h.refKg*FACTORS.gwp;
  const orn=Math.round(h.rooms*365*h.occupancy);
  const laund=h.laundry?orn*FACTORS.laundry:0;
  const total=s2e+s1g+s1h+s1r+laund;
  return {orn,s2e,s1g,s1h,s1r,laund,total,per:total/orn,perM2:total/h.floor};
}
function genHotels(){
  const city=CITIES[state.dest], rng=mulberry32(hash(state.dest+'hotels7'));
  const names=shuffle(HOTEL_NAMES,rng).slice(0,8);
  const stars=shuffle([3,4,4,4,5,3,5,4],rng);
  return names.map((nm,i)=>{
    const st=stars[i], rooms=Math.round(55+rng()*250);
    const h={
      id:'H'+(i+1), name:nm, stars:st, rooms,
      district:city.districts[Math.floor(rng()*city.districts.length)],
      occupancy:0.62+rng()*0.30,
      elec:Math.round(rooms*(13500+rng()*8500)*(st===5?1.18:st===4?1.05:1)),
      gas:rng()<0.3?0:Math.round(rooms*(5500+rng()*8500)),
      heat:(state.dest==='BER'||state.dest==='CPH'||state.dest==='CPH')&&rng()<0.7?Math.round(rooms*(4000+rng()*5500)):0,
      refKg:+(rooms*(0.12+rng()*0.22)).toFixed(1),
      laundry:rng()<0.45,
      price:Math.round((st===5?280:st===4?150:85)*city.idx*(0.88+rng()*0.4)),
      certs:rng()<0.5?[pickR(rng,CERTS)]:[],
      floor:Math.round(rooms*(34+rng()*10))
    };
    h.h=hcmi(h,city.grid);
    return h;
  });
}
function rankHotels(){
  const L=state.hotels.filter(h=>h.stars>=state.minStars);
  state.hVis=L;
  L.forEach(h=>h.p2=!L.some(g=>g!==h&&g.price<=h.price&&g.h.per<=h.h.per&&(g.price<h.price||g.h.per<h.h.per)));
  const w={p:state.wH.price/(state.wH.price+state.wH.carbon),c:state.wH.carbon/(state.wH.price+state.wH.carbon)};
  const pr=[Math.min(...L.map(h=>h.price)),Math.max(...L.map(h=>h.price))];
  const pc=[Math.min(...L.map(h=>h.h.per)),Math.max(...L.map(h=>h.h.per))];
  L.forEach(h=>h.score=w.p*(h.price-pr[0])/(pr[1]-pr[0]||1)+w.c*(h.h.per-pc[0])/(pc[1]-pc[0]||1));
  L.sort((a,b)=>a.score-b.score);
  L.forEach((h,i)=>h.rank=i+1);
}
function computeDerivedHotels(){
  const per=state.hotels.map(h=>h.h.per).sort((a,b)=>a-b);
  state.hMedPer=median(per);
  state.hQ=[per[Math.floor(per.length*0.25)],per[Math.floor(per.length*0.75)]];
  rankHotels();
}
const hBand = h => h.h.per<=state.hQ[0]?'low':h.h.per>=state.hQ[1]?'high':'mid';

function tripTotals(){
  const t={price:0,co2:0,fP:0,fC:0,hP:0,hC:0};
  if(state.selF){t.fP=state.selF.price*state.pax*2; t.fC=co2Disp(state.selF)*state.pax*2;}
  if(state.selH){const n=nights(),r=roomsN(); t.hP=state.selH.price*r*n; t.hC=state.selH.h.per*r*n;}
  t.price=t.fP+t.hP; t.co2=t.fC+t.hC; return t;
}

/* ================================================================
   4 · SEARCH
================================================================ */
function doSearch(){
  const errs=[];
  if(!state.depart||!state.ret) errs.push('Pick your dates.');
  else if(nights()<1) errs.push('Return / check-out must fall after departure / check-in.');
  if(state.tab==='flights'&&state.origin===state.dest) errs.push('Origin and destination must differ.');
  if(errs.length){const e=$('#perr');if(e)e.textContent=errs[0];return}
  const e=$('#perr');if(e)e.textContent='';
  if(state.tab==='flights'){
    state.gc=haversine(CITIES[state.origin],CITIES[state.dest]);
    state.flights=genFlights(); computeDerivedFlights();
    state.hotels=genHotels(); computeDerivedHotels();
    state.fSearch=true; state.hSearch=true;
    state.selF=null; state.selH=null; state.openF=null; state.openH=null;
    state.view='flights'; render();
    toast(`${state.flights.length} itineraries · ${state.hotels.length} HCMI-audited stays · ${CITIES[state.dest].city}`,'leaf');
  }else{
    state.hotels=genHotels(); computeDerivedHotels();
    state.hSearch=true;
    state.selH=null; state.openH=null;
    state.view='hotels'; render();
    toast(`${state.hotels.length} properties audited in ${CITIES[state.dest].city} · median ${state.hMedPer.toFixed(1)} kgCO₂e/room-night`,'bed-double');
  }
  window.scrollTo({top:0});
}
function updateFacts(){
  const el=$('#pfacts'); if(!el)return;
  const d=CITIES[state.dest];
  if(state.tab==='flights'){
    const gc=Math.round(haversine(CITIES[state.origin],CITIES[state.dest]));
    const est=(gc+95)*efBand(gc)*0.87*CABINS[state.cabin].mult;
    el.textContent=`${fmtI(gc)} km great-circle · ${nights()} nights in ${d.city} · grid ${d.cc} ${d.grid.toFixed(3)} kgCO₂e/kWh · ≈ ${kgS(est)} CO₂e / traveller (est.)`;
  }else{
    el.textContent=`${d.city} · ${nights()} nights · ${roomsN()} room${roomsN()>1?'s':''} · grid ${d.cc} ${d.grid.toFixed(3)} kgCO₂e/kWh · HCMI audit runs on search`;
  }
}

/* ================================================================
   5 · VIEW · HOME
================================================================ */
function vHome(){
  const opts=k=>Object.keys(CITIES).map(c=>`<option value="${c}" ${c===k?'selected':''}>${CITIES[c].city} (${c})</option>`).join('');
  const min=iso(new Date());
  const routeRows=ROUTES.map(([o,d])=>{
    const gc=Math.round(haversine(CITIES[o],CITIES[d]));
    const est=(gc+95)*efBand(gc+95)*0.87*2;
    const fare=(38+gc*fareKm(gc))*0.95;
    return `<div class="rrow" data-o="${o}" data-d="${d}">
      <b>${CITIES[o].city} → ${CITIES[d].city}</b>
      <span class="rv"><em>${fmtI(gc)}</em> km</span>
      <span class="rv">≈ <em>${kgS(est)}</em> return</span>
      <span class="rv rc">${fmtE(fare)}</span>
      <span class="go">Search this <i data-lucide="arrow-right"></i></span>
    </div>`;
  }).join('');
  return `
  <div class="vwrap">
  <section class="hero">
    <svg class="arcs" viewBox="0 0 1440 760" preserveAspectRatio="none">

function wireHome(){
  updateFacts();
  const tabBtns=document.querySelectorAll('.ptab');
  tabBtns.forEach(b=>b.addEventListener('click',()=>{
    state.tab=b.dataset.tab;
    tabBtns.forEach(x=>x.classList.toggle('on',x===b));
    $('#pf-flights').hidden=state.tab!=='flights';
    $('#pf-hotels').hidden=state.tab!=='hotels';
    $('#cabinMini').style.display=state.tab==='flights'?'':'none';
    updateFacts();
  }));
  $('#f-origin').addEventListener('change',e=>{state.origin=e.target.value;updateFacts()});
  $('#f-dest').addEventListener('change',e=>{state.dest=e.target.value;updateFacts()});
  $('#h-dest').addEventListener('change',e=>{state.dest=e.target.value;updateFacts()});
  const depChange=e=>{state.depart=e.target.value;updateFacts()};
  const retChange=e=>{state.ret=e.target.value;updateFacts()};
  ['f-dep','h-in'].forEach(id=>$('#'+id).addEventListener('change',depChange));
  ['f-ret','h-out'].forEach(id=>$('#'+id).addEventListener('change',retChange));
  $('#paxUp').addEventListener('click',()=>{state.pax=Math.min(6,state.pax+1);$('#paxn').textContent=state.pax;updateFacts()});
  $('#paxDn').addEventListener('click',()=>{state.pax=Math.max(1,state.pax-1);$('#paxn').textContent=state.pax;updateFacts()});
  $('#cabinSel').addEventListener('change',e=>{state.cabin=e.target.value;updateFacts()});
  $('#goSearch').addEventListener('click',doSearch);
  document.querySelectorAll('.rrow').forEach(r=>r.addEventListener('click',()=>{
    state.origin=r.dataset.o; state.dest=r.dataset.d; state.tab='flights';
    state.depart=iso(new Date(Date.now()+14*864e5));
    state.ret=iso(new Date(Date.now()+18*864e5));
    render();
    const p=$('#spanel'); p.scrollIntoView({behavior:'smooth',block:'center'});
    p.classList.remove('pulse'); void p.offsetWidth; p.classList.add('pulse');
  }));
}

function flightSheet(f){

    <td class="n">${kgS(legCO2(l.dist,l.ac,cab.mult))}</td></tr>`).join('');
  return `<h5>Passenger emissions account · ${f.id}</h5>
  <table class="t"><tr><th>segment</th><th>aircraft</th><th class="n">distance</th><th class="n">class factor</th><th class="n">cabin</th><th class="n">eff.</th><th class="n">CO₂e</th></tr>

}

  const cheap=L.reduce((a,b)=>b.price<a.price?b:a), green=L.reduce((a,b)=>b.co2<a.co2?b:a);
  const s=[`Weights live — climate ${Math.round(w.carbon*100)}%, price ${Math.round(w.price*100)}%, time ${Math.round(w.time*100)}%.`];
  s.push(top.par?`Rank #1 (${airlineName(top)}) is Pareto-optimal — no itinerary beats it on price, time and carbon at once.`:`Rank #1 scores best under your current weight mix.`);
  if(top!==cheap){
    const dp=top.price-cheap.price, dc=cheap.co2-top.co2;
    if(dc>1)s.push(`Versus the lowest fare (${fmtE(cheap.price)}), it adds ${fmtE(dp)} to avoid ${kg(dc)} — an abatement cost of ${fmtE2(dp/dc)} per kg.`);
  } else s.push(`It is also the cheapest itinerary on this route.`);
  if(top!==green)s.push(`The cleanest option would cut a further ${kg(top.co2-green.co2)} for ${fmtE(Math.max(0,green.price-top.price))} more${green.dur>top.dur?` and ${dur(green.dur-top.dur)} longer`:''}.`);
  el.textContent=s.join(' ');
}
function selectFlight(id){
  const f=state.flights.find(x=>x.id===id); if(!f)return;
  if(state.selF&&state.selF.id===id){toast('This outbound is already held.','info');return}

  <div class="rise" style="animation-delay:.09s">

    <div class="comp"><i style="width:${t.co2?(t.fC/t.co2*100):0}%;background:var(--acc)"></i><i style="width:${t.co2?(t.hC/t.co2*100):0}%;background:var(--amber)"></i></div>
    <div class="compleg"><span style="--sw:var(--acc)">flights — ${kg(t.fC)}${t.co2?` (${Math.round(t.fC/t.co2*100)}%)`:''}</span>
      <span style="--sw:var(--amber)">stay — ${kg(t.hC)}${t.co2?` (${Math.round(t.hC/t.co2*100)}%)`:''}</span></div>
    ${h?'':'<div class="fnote">No stay held yet — flight-only account. <a href="#" id="addstay" style="color:var(--acc)">Choose a stay</a> for the complete picture.</div>'}
  </div>
  <div class="rise" style="animation-delay:.12s">
    <div class="sect"><span class="k">02</span><h3>Against what you could have booked</h3></div>
    ${benchGroup('Flight · per traveller, outbound',[['Your pick',co2Disp(f),true],['Best available',fB[0]],['Route median',state.fMed.co2*rf],['Highest',fB[1]]])}
    ${benchGroup('Stay · per occupied room-night',h?[['Your pick',h.h.per,true],['Cleanest property',hB[0]],['City median',state.hMedPer],['Highest',hB[1]]]:[['Cleanest property',hB[0]],['City median',state.hMedPer],['Highest',hB[1]]])}
  </div>
  <div class="rise" style="animation-delay:.15s">
    <div class="sect"><span class="k">03</span><h3>What that weight means</h3></div>
    <div class="equiv">${eq.map(e=>`<div class="eq"><i data-lucide="${e[0]}"></i><span><b>${e[1]}</b><span>${e[2]}</span></span></div>`).join('')}</div>
  </div>
  <div class="rise" style="animation-delay:.18s">
    <div class="sect"><span class="k">04</span><h3>Itinerary on record</h3></div>
    <table class="t" style="max-width:780px">
      <tr><td>Outbound</td><td>${airlineName(f)} · ${f.no} · ${hhmm(f.dep)} → ${arrT} · ${dur(f.dur)}${f.stops?` · via ${CITIES[f.via].city}`:''}</td><td class="n">${fmtE(f.price*state.pax)}</td><td class="n">${kg(co2Disp(f)*state.pax)}</td></tr>
      <tr><td>Return</td><td>mirrors outbound · same cabin & aircraft class</td><td class="n">${fmtE(f.price*state.pax)}</td><td class="n">${kg(co2Disp(f)*state.pax)}</td></tr>
      <tr><td>Stay</td><td>${h?`${h.name} · ${h.district} · ${n} nights · ${r} room · ${h.h.per.toFixed(1)} kgCO₂e/room-night (HCMI v1.1)`:'not selected'}</td><td class="n">${h?fmtE(h.price*r*n):'—'}</td><td class="n">${h?kg(h.h.per*r*n):'—'}</td></tr>
      <tr class="total"><td>Total</td><td></td><td class="n">${fmtE(t.price)}</td><td class="n">${kg(t.co2)}</td></tr>
    </table>
  </div>
  <div class="rise" style="animation-delay:.21s">
    <div class="sect"><span class="k">05</span><h3>Methodology, in full</h3></div>
    <details class="acc"><summary>Flight emissions — BEIS 2023 distance-class model</summary><div class="ab">
      <b>CO₂e per passenger = Σ legs [ distance × class factor × cabin factor × aircraft efficiency ]</b>.
      Distance is great-circle plus a <code>+95 km</code> detour uplift. Class factors (kgCO₂/pax-km, economy): <code>&lt;1,500 km → 0.158</code> · <code>1,500–4,000 km → 0.120</code> · <code>&gt;4,000 km → 0.115</code>.
      Cabin multipliers: Economy ×1.00 · Premium ×1.60 · Business ×2.92 · First ×4.02. Aircraft efficiency versus fleet average:
      <table class="t"><tr><th>type</th><th class="n">efficiency</th></tr>${acRows}</table>
      Factors embed an 82% fleet-average passenger load. The optional basis adds non-CO₂ radiative effects via an RF index of <code>×${RF}</code>. Return leg mirrors the outbound itinerary.
    </div></details>
    <details class="acc"><summary>Hotel carbon — HCMI v1.1, per occupied room-night</summary><div class="ab">
      <b>kgCO₂e / occupied room-night = (scope 1 + scope 2 + outsourced laundry) ÷ (rooms × 365 × annual occupancy)</b>.
      Scope 1: natural gas <code>${FACTORS.gas} kg/kWh</code>, district heat <code>${FACTORS.heat} kg/kWh</code>, refrigerant R-410A leakage at GWP <code>${fmtI(FACTORS.gwp)}</code> (AR4, GWP₁₀₀).
      Scope 2: purchased electricity at the regional grid factor. Outsourced laundry is estimated at <code>${FACTORS.laundry} kg</code> per occupied room-night. Regional grid factors (kgCO₂e/kWh, illustrative annual averages):
      <table class="t"><tr><th>region</th><th class="n">factor</th></tr>${grRows}</table>
      HCMI also reports per-m² intensity — shown in each property sheet.
    </div></details>
    <details class="acc"><summary>Disclosures & data provenance</summary><div class="ab">
      This is a design prototype: itineraries, properties and utility feeds are deterministically generated per route so figures are reproducible. A production deployment would ingest live utility metering and HCMI/CHSB property submissions, and sync factor sets annually. Figures are <b>estimates for comparison at the point of purchase, not guarantees</b>. EcoVoyage ranks reductions first — no offsets are bundled into fares, and no option is labelled “green” without a number behind it.
    </div></details>
  </div>
  <div class="holdzone rise" style="animation-delay:.24s">
    <button class="btn" id="holdbtn">Hold this itinerary <i data-lucide="scroll-text"></i></button>
    <span class="k" style="letter-spacing:.1em">free hold · 24 h · no payment</span>
  </div>
  </div>`;
}
function wireSummary(){
  const t=tripTotals();
  countUp($('#totP'),t.price,v=>fmtE(v));
  countUp($('#totC'),t.co2,v=>kg(v));
  $('#backHome3').addEventListener('click',()=>{state.view='home';render()});
  const add=$('#addstay'); if(add)add.addEventListener('click',e=>{e.preventDefault();go('hotels')});
  $('#holdbtn').addEventListener('click',openHold);
}

/* ================================================================
   9 · SCATTER ENGINE
================================================================ */
function drawScatter(cv,wraps,cfg){
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth||520, H=cv.clientHeight||300;
  cv.width=W*dpr; cv.height=H*dpr;
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  if(!wraps.length)return;
  const M={l:56,r:16,t:18,b:42};
  const xs=wraps.map(w=>w.x), ys=wraps.map(w=>w.y);
  const xmin=Math.min(...xs), xmax=Math.max(...xs), ymin=Math.min(...ys), ymax=Math.max(...ys);
  const x0=xmin-(xmax-xmin||xmin)*.08, x1=xmax+(xmax-xmin||xmax)*.08;
  const y0=ymin-(ymax-ymin||ymin)*.12, y1=ymax+(ymax-ymin||ymax)*.12;
  const X=v=>M.l+(v-x0)/(x1-x0)*(W-M.l-M.r), Y=v=>H-M.b-(v-y0)/(y1-y0)*(H-M.t-M.b);
  const srt=[...wraps].sort((a,b)=>a.x-b.x); let best=Infinity;
  srt.forEach(w=>{if(w.y<best){w.solid=true;best=w.y}else w.solid=false});
  x.strokeStyle='rgba(231,239,232,.28)'; x.lineWidth=1;
  x.beginPath(); x.moveTo(M.l,H-M.b); x.lineTo(W-M.r,H-M.b); x.moveTo(M.l,M.t); x.lineTo(M.l,H-M.b); x.stroke();
  x.font='500 9.5px "IBM Plex Mono"'; x.fillStyle=C_T2;
  ticks(x0,x1,4).forEach(v=>{const p=X(v);x.beginPath();x.moveTo(p,H-M.b);x.lineTo(p,H-M.b+4);x.stroke();x.textAlign='center';x.fillText(cfg.fx(v),p,H-M.b+16)});
  ticks(y0,y1,4).forEach(v=>{const p=Y(v);x.beginPath();x.moveTo(M.l-4,p);x.lineTo(M.l,p);x.stroke();x.textAlign='right';x.fillText(cfg.fy(v),M.l-9,p+3)});
  x.textAlign='center'; x.fillText(cfg.xt,(M.l+W-M.r)/2,H-8);
  x.save(); x.translate(13,(M.t+H-M.b)/2); x.rotate(-Math.PI/2); x.fillText(cfg.yt,0,0); x.restore();
  const fr=wraps.filter(w=>w.solid).sort((a,b)=>a.x-b.x);
  if(fr.length>1){x.strokeStyle=C_ACC;x.lineWidth=1.2;x.setLineDash([4,3]);
    x.beginPath();fr.forEach((w,i)=>i?x.lineTo(X(w.x),Y(w.y)):x.moveTo(X(w.x),Y(w.y)));x.stroke();x.setLineDash([])}
  wraps.forEach(w=>{const px=X(w.x),py=Y(w.y);w.px=px;w.py=py;
    x.beginPath();x.arc(px,py,w.r,0,7);
    x.fillStyle=w.solid?C_ACC:C_PANEL; x.fill();
    x.strokeStyle=w.solid?C_ACC:'rgba(154,175,160,.85)'; x.lineWidth=w.solid?1.4:1; x.stroke();});
  if(cfg.selId){const w=wraps.find(w=>w.f?w.f.id===cfg.selId:w.h.id===cfg.selId);
    if(w){x.beginPath();x.arc(w.px,w.py,w.r+4.5,0,7);x.strokeStyle=C_ACC;x.lineWidth=1.8;x.stroke()}}
  cv._cfg=cfg;
}
function bindScatterEvents(cv,tip,getWraps){
  if(!cv)return;
  let hover=null;
  cv.addEventListener('mousemove',e=>{
    const rect=cv.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const wraps=getWraps()||[]; let best=null,bd=400;
    wraps.forEach(w=>{const d=(w.px-mx)**2+(w.py-my)**2;if(d<bd){bd=d;best=w}});
    hover=(best&&bd<289)?best:null;
    if(hover){tip.style.display='block';tip.innerHTML=cv._cfg.tip(hover);
      const tw=tip.offsetWidth, wrap=cv.parentElement.clientWidth;
      tip.style.left=Math.min(Math.max(8,hover.px+16),wrap-tw-8)+'px';
      tip.style.top=Math.max(4,hover.py-70)+'px';
    } else tip.style.display='none';
  });
  cv.addEventListener('mouseleave',()=>{tip.style.display='none';hover=null});
  cv.addEventListener('click',()=>{if(hover&&cv._cfg.onClick)cv._cfg.onClick(hover.f?hover.f.id:hover.h.id)});
}

/* ================================================================

================================================================ */
function openModal(html){$('#mbody').innerHTML=html;$('#mback').classList.add('on');icons()}
function closeModal(){$('#mback').classList.remove('on')}
 $('#mclose').addEventListener('click',closeModal);
 $('#mback').addEventListener('click',e=>{if(e.target.id==='mback')closeModal()});
function openSignin(){
  openModal(`<div class="k">EcoVoyage account</div><h3>Welcome back</h3>
  <div class="mf"><label class="k">email</label><input type="email" placeholder="you@example.com"></div>
  <div class="mf"><label class="k">password</label><input type="password" placeholder="••••••••"></div>
  <button class="btn full" id="signinGo">Sign in <i data-lucide="arrow-right"></i></button>
  <p class="fine">Prototype build — accounts are simulated, nothing is stored or sent anywhere.</p>`);
  $('#signinGo').addEventListener('click',()=>{closeModal();toast('Signed in as demo traveller · preferences loaded','user')});
}
function openHold(){
  const t=tripTotals(), f=state.selF, h=state.selH, n=Math.max(1,nights()), r=roomsN();
  openModal(`<div class="k">Itinerary hold</div><h3>Review & hold</h3>
  <dl class="ml">
    <div><dt>Outbound / Return</dt><dd>${airlineName(f)} · ${hhmm(f.dep)} → ${hhmm(f.arr)}${f.stops?' · via '+CITIES[f.via].city:''}</dd></div>
    <div><dt>Stay</dt><dd>${h?`${h.name} · ${n}n · ${r} room${r>1?'s':''}`:'none selected'}</dd></div>
    <div><dt>Party</dt><dd>${state.pax} traveller${state.pax>1?'s':''} · ${CABINS[state.cabin].name}</dd></div>
    <div><dt>Total fare</dt><dd class="n">${fmtE(t.price)}</dd></div>
    <div><dt>Total carbon account</dt><dd class="n" style="color:var(--acc)">${kg(t.co2)}</dd></div>
  </dl>
  <p class="fine">No payment is taken. Holds expire after 24 hours. Carbon figures follow the standards disclosed in the trip summary — standardized estimates for comparison, not guarantees.</p>
  <div class="mbtns"><button class="btn ghost" id="mcancel">Keep editing</button><button class="btn" id="mhold">Hold itinerary</button></div>`);
  $('#mcancel').addEventListener('click',closeModal);
  $('#mhold').addEventListener('click',()=>{
    const b=$('#mhold'); b.disabled=true; b.textContent='Reserving…';
    setTimeout(()=>{
      const ref='ECV-'+Math.random().toString(36).slice(2,7).toUpperCase();
      $('#mbody').innerHTML=`<div class="holdok">
        <i data-lucide="badge-check"></i><h3>Itinerary held</h3>
        <div class="ref">${ref}</div>
        <p class="fine">Reference valid 24 h. The carbon account of this trip (${kg(t.co2)}) is attached to the hold and will appear on your confirmation.</p>
        <div class="mbtns" style="justify-content:center"><button class="btn" id="mok">Back to summary</button></div></div>`;
      icons();
      $('#mok').addEventListener('click',closeModal);
      toast(`Itinerary held · ref ${ref} · valid 24 h`,'scroll-text');
    },850);
  });
}
function go(view){
  if(view==='flights'&&!state.fSearch){toast('Run a flight search first — home panel.','plane');return}
  if(view==='hotels'&&!state.hSearch){toast('Search a destination first — home panel.','bed-double');return}
  if(view==='summary'&&!state.selF){toast('Select an outbound flight before the summary.','plane');return}
  state.view=view; render(); window.scrollTo({top:0});
}
function updateBar(){
  const on=state.view!=='home';
  document.body.classList.toggle('has-bar',on);
  if(!on)return;
  const t=tripTotals(), bits=[];
  if(state.fSearch)bits.push(`<span>${state.origin} → ${state.dest} · ${Math.max(1,nights())}n · ${state.pax} pax</span>`);
  else bits.push(`<span>${CITIES[state.dest].city} · ${Math.max(1,nights())}n</span>`);
  if(state.selF)bits.push(`<span><i data-lucide="plane"></i>${airlineName(state.selF)} held</span>`);
  if(state.selH)bits.push(`<span><i data-lucide="bed-double"></i>${state.selH.name}</span>`);
  if(t.price||t.co2)bits.push(`<b>${fmtE(t.price)} · ${kg(t.co2)}</b>`);
  $('#tbsum').innerHTML=bits.join('');
  const nb=$('#tbnext'); let lab='Continue',dis=false;
  if(state.view==='flights'){lab=state.selF?'Choose stay':'Select a flight';dis=!state.selF}
  else if(state.view==='hotels'){
    if(state.selF&&state.selH)lab='Trip summary';
    else if(state.selF)lab='Open summary';
    else{lab='Add a flight';}
  }
  else if(state.view==='summary'){lab='Hold itinerary'}
  nb.textContent=lab; nb.disabled=dis;
  $('#tbprev').style.visibility='visible';
  icons();
}
 $('#tbnext').addEventListener('click',()=>{
  if(state.view==='flights'){if(state.selF)go('hotels')}
  else if(state.view==='hotels'){
    if(state.selF)go('summary');
    else if(state.fSearch)go('flights');
    else{state.view='home';render();window.scrollTo({top:0});toast('Start a flight search to complete the trip.','plane')}
  }
  else if(state.view==='summary')openHold();
});
 $('#tbprev').addEventListener('click',()=>{
  if(state.view==='flights'){state.view='home';render()}
  else if(state.view==='hotels'){state.fSearch?go('flights'):(state.view='home',render())}
  else if(state.view==='summary'){state.hSearch?go('hotels'):go('flights')}
  window.scrollTo({top:0});
});
 $('#brandHome').addEventListener('click',()=>{state.view='home';render();window.scrollTo({top:0})});
document.querySelectorAll('.nlinks a[data-goto]').forEach(a=>a.addEventListener('click',()=>{
  const id=a.dataset.goto;
  if(state.view!=='home'){state.view='home';render()}
  requestAnimationFrame(()=>{const el=document.getElementById(id);el&&el.scrollIntoView({behavior:'smooth'})});
}));
 $('#signinBtn').addEventListener('click',openSignin);
 $('#startedBtn').addEventListener('click',()=>{
  if(state.view!=='home'){state.view='home';render()}
  requestAnimationFrame(()=>{
    const p=$('#spanel'); if(!p)return;
    p.scrollIntoView({behavior:'smooth',block:'center'});
    p.classList.remove('pulse'); void p.offsetWidth; p.classList.add('pulse');
    setTimeout(()=>$('#f-origin')&&$('#f-origin').focus(),500);
  });
});

/* ================================================================
   11 · RENDER & INIT
================================================================ */
function render(){
  const v=$('#app');
  document.body.classList.toggle('reference-active',state.view==='home');
  if(state.view==='home'){v.innerHTML=vHomeReference();wireHome();const ref=$('#startedBtnRef');if(ref)ref.addEventListener('click',()=>$('#startedBtn').click())}
  else if(state.view==='flights'){v.innerHTML=vFlights();wireFlights()}
  else if(state.view==='hotels'){v.innerHTML=vHotels();wireHotels()}
  else if(state.view==='summary'){v.innerHTML=vSummary();wireSummary()}
  icons(); updateBar();
}
window.addEventListener('resize',()=>{
  if($('#scf'))drawScatterF();
  if($('#sch'))drawScatterH();
});
let liveN=12431;
setInterval(()=>{liveN+=2+Math.floor(Math.random()*12);const el=document.getElementById('liveco2');if(el)el.textContent=liveN.toLocaleString('en-GB')},2600);
render();
</script>
